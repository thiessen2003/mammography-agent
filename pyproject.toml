[project]
name = "mammography-agent"
version = "0.1.0"
description = "Medical radiology analysis system with LangGraph orchestrator and parallel analysis agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.99.9",
    "pydantic>=2.0.0",  # For schema validation
    "numpy>=1.24.0",    # For numerical calculations in risk assessment
    "langgraph>=0.2.0", # For multi-agent workflow
    "langchain>=0.3.0", # For LangChain components
    "langchain-openai>=0.2.0", # For OpenAI integration
    "langsmith>=0.1.0", # For telemetry and tracing
    "fastapi>=0.104.0", # For API endpoints
    "uvicorn>=0.24.0",  # For API server
    "python-multipart>=0.0.6", # For file uploads
    "python-dotenv>=1.0.0", # For environment variables
    "Pillow>=10.0.0",   # For image processing
    "aiofiles>=23.0.0", # For async file operations
]

[tool.uv.workspace]
members = [
    "langgraph-agent",
]
